name: Build ChatSorter 26.1.2
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Compile with expanded diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle compileJava --console=plain --no-daemon --stacktrace -Dorg.gradle.jvmargs='-Xmx2G -XX:MaxMetaspaceSize=768m' 2>&1 | tee compile-log.txt
      - name: Package mod
        if: success()
        run: gradle build --console=plain
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatSorter-26.1.2-compile-log
          path: compile-log.txt
          if-no-files-found: ignore
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatSorter-1.4.5-mc26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
